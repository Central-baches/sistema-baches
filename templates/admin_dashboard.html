<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Estadísticas del Sistema</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .stats {
      display: flex;
      gap: 30px;
      margin-top: 30px;
    }
    .card {
      background-color: #f2f2f2;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 1;
      text-align: center;
    }
    .card h3 {
      margin-bottom: 10px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/admin-home">🏠 Menú Principal</a>
    <a href="/admin-panel">📋 Ver Reportes</a>
    <a href="/admin-usuarios">👥 Gestionar Usuarios</a>
    <a href="/admin/reportes/exportar">📤 Exportar Reportes</a>
    <a href="/logout">🔒 Cerrar Sesión</a>
  </nav>

  <div class="container">
    <h2>📊 Estadísticas del Sistema</h2>
    <div class="stats">
      <div class="card">
        <h3>👥 Total de Usuarios</h3>
        <p id="usuarios">...</p>
      </div>
      <div class="card">
        <h3>🚧 Total de Reportes</h3>
        <p id="reportes">...</p>
      </div>
      <div class="card">
        <h3>🗂️ Tipos de Reportes</h3>
        <ul id="tipos"></ul>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const rol = localStorage.getItem("rol");

    async function cargarEstadisticas() {
      const res = await fetch("/admin/dashboard", {
        headers: { "Authorization": "Bearer " + token }
      });

      if (!res.ok) {
        alert("❌ Error al cargar estadísticas");
        return;
      }

      const data = await res.json();
      document.getElementById("usuarios").textContent = data.usuarios;
      document.getElementById("reportes").textContent = data.reportes;

      const lista = document.getElementById("tipos");
      lista.innerHTML = "";
      data.tipos_de_reportes.forEach(tipo => {
        const li = document.createElement("li");
        li.textContent = tipo;
        lista.appendChild(li);
      });
    }

    if (rol === "admin") {
      cargarEstadisticas();
    } else {
      alert("❌ Acceso denegado");
      window.location.href = "/login";
    }
  </script>
</body>
</html>
