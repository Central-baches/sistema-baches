
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Detección de Baches</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-page">

  <main class="login-layout">
    <section class="login-card">

      <div class="brand-icon" aria-hidden="true">⚠</div>

      <p class="subtitle">SISTEMA DE MONITOREO VIAL</p>

      <h1>Detección de Baches</h1>

      <p class="description">
        Bienvenido. Inicia sesión para acceder al sistema
        de detección y seguimiento de baches.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="Ingresa tu correo electrónico"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="mensaje" class="mensaje" role="alert"
           aria-live="polite"></p>

        <button type="submit" id="loginButton">
          Iniciar sesión
        </button>

      </form>

      <div class="register">
        ¿No tienes una cuenta?
        <a href="/register">Regístrate aquí</a>
      </div>

      <div class="card-footer">
        Sistema de detección y reporte de baches
      </div>

    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("loginButton");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      mensaje.textContent = "";
      mensaje.className = "mensaje";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      boton.disabled = true;
      boton.textContent = "Verificando...";

      try {
        const res = await fetch("/auth/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            username: email,
            password: password
          })
        });

        if (!res.ok) {
          mensaje.textContent = "Correo o contraseña incorrectos.";
          mensaje.classList.add("error");
          return;
        }

        const data = await res.json();
        localStorage.setItem("token", data.access_token);

        const perfil = await fetch("/auth/me", {
          headers: {
            "Authorization": "Bearer " + data.access_token
          }
        });

        if (!perfil.ok) {
          localStorage.removeItem("token");
          mensaje.textContent = "No se pudo obtener tu perfil.";
          mensaje.classList.add("error");
          return;
        }

        const usuario = await perfil.json();

        localStorage.setItem("rol", usuario.rol);
        localStorage.setItem("email", usuario.email);

        if (usuario.rol === "admin") {
          window.location.href = "/admin-home";
        } else {
          window.location.href = "/user-home";
        }

      } catch (error) {
        console.error("Error en login:", error);
        mensaje.textContent =
          "No se pudo conectar con el servidor. Inténtalo nuevamente.";
        mensaje.classList.add("error");

      } finally {
        boton.disabled = false;
        boton.textContent = "Iniciar sesión";
      }
    });
  </script>

</body>
</html>
