<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" required />

      <label for="password">Contraseña:</label>
      <input type="password" id="password" required />

      <button type="submit">Ingresar</button>
    </form>

    <p id="mensaje"></p>
    <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        // 🔐 Solicitar token
        const res = await fetch("/auth/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ username: email, password: password })
        });

        if (!res.ok) {
          mensaje.textContent = "❌ Credenciales incorrectas";
          return;
        }

        const data = await res.json();
        localStorage.setItem("token", data.access_token);

        // 👤 Obtener perfil del usuario
        const perfil = await fetch("/auth/me", {
          headers: { "Authorization": "Bearer " + data.access_token }
        });

        if (!perfil.ok) {
          mensaje.textContent = "❌ Error al obtener perfil";
          return;
        }

        const usuario = await perfil.json();
        localStorage.setItem("rol", usuario.rol);
        localStorage.setItem("email", usuario.email);

        // 🚀 Redirigir según el rol
        if (usuario.rol === "admin") {
          window.location.href = "/admin-home"; // ← redirige al menú principal
        } else {
          window.location.href = "/user-home"; // ← vista del usuario normal
        }
      } catch (error) {
        console.error("Error en login:", error);
        mensaje.textContent = "❌ Error de conexión o servidor";
      }
    });
  </script>
</body>
</html>
