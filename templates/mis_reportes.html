<!-- templates/mis_reportes.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Reportes</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    nav {
      background-color: #444;
      padding: 10px;
    }
    nav a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      margin: 20px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/user-home">📋 Menú Principal</a>
  </nav>

  <h2>📋 Mis Reportes</h2>
  <table border="1" style="width:100%; text-align:center;">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Ubicación</th>
        <th>Tipo</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tabla-reportes">
      <!-- Aquí se llenarán los reportes vía JS -->
    </tbody>
  </table>

  <script>
    async function cargarReportes() {
      const token = localStorage.getItem("token");
      const res = await fetch("/api/mis-reportes", {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      const tbody = document.getElementById("tabla-reportes");
      tbody.innerHTML = "";
      data.forEach(r => {
        const fila = `<tr>
          <td>${r.fecha}</td>
          <td>${r.ubicacion}</td>
          <td>${r.tipo}</td>
          <td>${r.estado || "Pendiente"}</td>
        </tr>`;
        tbody.innerHTML += fila;
      });
    }
    cargarReportes();
  </script>
</body>
</html>
